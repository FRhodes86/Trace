<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Breath of Knowledge</title>
<meta name="description" content="A Zelda-inspired adventure that takes children through the whole GL Assessment 11+ curriculum.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Lexend:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- shared SVG patterns for the non-verbal reasoning pictures -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <pattern id="stripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#fffdf6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#1d1408" stroke-width="3"/>
    </pattern>
  </defs>
</svg>
<canvas id="bgfx" aria-hidden="true"></canvas>
<main id="app"></main>
<canvas id="fgfx" aria-hidden="true"></canvas>
<div id="overlay"></div>
<noscript>This game needs JavaScript turned on.</noscript>
<script src="js/util.js"></script>
<script src="js/content/wordbank.js"></script>
<script src="js/content/maths.js"></script>
<script src="js/content/english.js"></script>
<script src="js/content/verbal.js"></script>
<script src="js/content/nonverbal.js"></script>
<script src="js/story.js"></script>
<script src="js/art.js"></script>
<script src="js/fx.js"></script>
<script src="js/catalog.js"></script>
<script src="js/items.js"></script>
<script src="js/state.js"></script>
<script src="js/game.js"></script>
<script src="js/world.js"></script>
<script src="js/house.js"></script>
<script src="js/regions.js"></script>
</body>
</html>
