      <div class="kass-row"><div class="kass-mini">${ART.kass()}</div><div class="staff" id="staff"><div class="lines">${'<i></i>'.repeat(5)}</div><div class="notes" id="notes"></div></div></div>
      <p id="msg" class="muted">Listen…</p>
      <div class="ocarina"><button class="oc oc-a" data-pad="0">A</button><div class="cpad">${[1, 2, 3, 4].map(i => `<button class="oc oc-c ${SONG_PADS[i][2]}" data-pad="${i}">${SONG_PADS[i][0]}</button>`).join('')}</div></div>
      <p>Melody length: <b id="len">0</b></p></div>`, 'verbal', 'home');
    const notes = () => $('#notes');
    const addNote = (i, cls = '') => { const n = notes(); if (!n) return; const p = SONG_PADS[i]; const d = document.createElement('span'); d.className = 'note ' + p[2] + ' ' + cls; d.style.top = (STAFF_Y[p[2]] * 11 + 2) + 'px'; d.textContent = p[0]; n.appendChild(d); };
    const flash = i => { const b = $(`[data-pad="${i}"]`); if (!b) return; b.classList.add('lit'); playNote(SONG_PADS[i][1]); setTimeout(() => b.classList.remove('lit'), 320); };
    const round = () => {
      if (!$('#len')) return; seq.push(U.int(0, 4)); $('#len').textContent = seq.length; busy = true; input = 0; $('#msg').textContent = 'Kass plays…'; notes().innerHTML = '';
      seq.forEach((n, k) => setTimeout(() => { if (!$('#len')) return; flash(n); addNote(n, 'kass-note'); }, 600 + k * 560));
      setTimeout(() => { busy = false; if ($('#msg')) { $('#msg').textContent = 'Your turn!'; notes().innerHTML = ''; } }, 900 + seq.length * 560);
    };
    const end = () => {
      over = true; const s = S(); const len = seq.length - 1; State.countMax('songBest', len); const prize = len * 12; s.rupees += prize; State.save();
      UI().modal(`<h3>${len >= 8 ? 'What a performance!' : 'Lovely playing!'}</h3><p>You remembered <b>${len}</b> note${len === 1 ? '' : 's'}.</p><p>Prize: <b>${prize} rupees</b></p>`, [{ label: 'Done', cls: 'primary', fn: kassIntro }]);
    };
    const press = i => {
      if (busy || over) return; flash(i);
      if (i !== seq[input]) { addNote(i, 'wrong'); U.sfx.wrong(); return end(); }
      addNote(i); input++; if (input === seq.length) { busy = true; $('#msg').textContent = 'Brilliant!'; setTimeout(round, 800); }
    };
    $$('[data-pad]').forEach(b => b.addEventListener('pointerdown', () => press(+b.dataset.pad)));
    UI().onKey(e => { const k = { a: 0, Enter: 0, ArrowUp: 1, ArrowLeft: 2, ArrowRight: 3, ArrowDown: 4 }[e.key]; if (k !== undefined) { e.preventDefault(); press(k); } });
    setTimeout(round, 400);
  }
  let actx;
  function playNote(f) { if (!S().settings.sound) return; try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), o2 = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 2; const g2 = actx.createGain(); g2.gain.value = 0.15; g.gain.setValueAtTime(0.0001, actx.currentTime); g.gain.exponentialRampToValueAtTime(0.22, actx.currentTime + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + 0.6); o.connect(g); o2.connect(g2); g2.connect(g); g.connect(actx.destination); o.start(); o2.start(); o.stop(actx.currentTime + 0.65); o2.stop(actx.currentTime + 0.65); } catch (e) { /* no audio */ } }

  /* Korok hide-and-seek in the Lost Woods: watch which big leaf the Korok hides under while they shuffle. */
  const LEAF = `<svg class="leaf-svg" viewBox="0 0 100 80"><ellipse cx="50" cy="74" rx="34" ry="5" fill="#000" opacity=".25"/><path d="M50,76 C20,72 6,52 10,34 C14,18 34,6 50,2 C66,6 86,18 90,34 C94,52 80,72 50,76Z" fill="#5fae3e" stroke="#1d1a2b" stroke-width="2.4"/><path d="M50,74 V6 M50,22 L36,14 M50,22 L64,14 M50,36 L26,26 M50,36 L74,26 M50,50 L20,42 M50,50 L80,42 M50,63 L26,58 M50,63 L74,58" stroke="#3f8f2d" stroke-width="2" fill="none"/><path d="M50,76 Q48,80 44,80" stroke="#6b4423" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M20,36 Q26,22 38,16" stroke="#9fe07a" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".8"/></svg>`;
  function leafIntro() {
    const s = S(); const { screen, hud, on } = UI();
    screen(`${hud()}<div class="page center"><div class="page-head">${back()}<h2>Korok Hide-and-Seek</h2><span class="pill">🎫 ${s.tickets}</span></div>
      <div class="npc-stand">${ART.korok()}</div>
      <p class="intro slate"><b>Korok:</b> "Yahaha! I'll hide under one of these big leaves, then shuffle them around. Find me! Every 2 rounds you win, I'll give you a Korok seed!"</p>
      <p class="muted">Times found: <b>${s.counters.leafWins || 0}</b></p>
      <button class="btn big primary glow" id="go">🍃 Play (🎫1)</button></div>`, 'plateau', 'field');
    on('#back', Game.map); on('#go', () => ticketGate('Hide-and-Seek', leafGame));
  }
  function leafGame() {
    const { screen } = UI(); let roundN = 0, wins = 0;
    screen(`<div class="page center"><h2>🍃 Where's the Korok?</h2><p id="msg" class="muted"></p>
      <div class="woods-clearing"><div class="leaves" id="leaves">${[0, 1, 2].map(i => `<button class="leaf" data-leaf="${i}" style="left:${8 + i * 32}%"><span class="kk">${ART.korok(true)}</span><span class="lf">${LEAF}</span></button>`).join('')}</div></div>
      <p>Round <b id="rn">1</b> · Found <b id="wn">0</b></p></div>`, 'plateau', 'field');
    let korokAt = 0, busy = true; const pos = [0, 1, 2];
    const place = () => $$('[data-leaf]').forEach(b => { b.style.left = (8 + pos[+b.dataset.leaf] * 32) + '%'; });
    const round = () => {
      if (!$('#rn')) return; roundN++; $('#rn').textContent = roundN; busy = true; korokAt = U.int(0, 2);
      $$('[data-leaf]').forEach(b => b.classList.toggle('show', +b.dataset.leaf === korokAt));
      $('#msg').textContent = 'Watch the Korok…';
      setTimeout(() => {
        if (!$('#msg')) return; $$('[data-leaf]').forEach(b => b.classList.remove('show'));
        const swaps = 3 + roundN * 2, speed = Math.max(220, 520 - roundN * 50); let k = 0;
        const sw = setInterval(() => { if (!$('#leaves')) return clearInterval(sw); const a = U.int(0, 2); let b = U.int(0, 2); if (a === b) b = (b + 1) % 3; const ia = pos.indexOf(a), ib = pos.indexOf(b); [pos[ia], pos[ib]] = [pos[ib], pos[ia]]; place(); U.sfx.tick(); if (++k >= swaps) { clearInterval(sw); busy = false; if ($('#msg')) $('#msg').textContent = 'Which leaf is the Korok under?'; } }, speed);
      }, 1100);
    };
    $$('[data-leaf]').forEach(b => b.addEventListener('click', () => {
      if (busy) return; busy = true; const i = +b.dataset.leaf; $$('[data-leaf]').forEach(x => x.classList.toggle('show', +x.dataset.leaf === korokAt));
      if (i === korokAt) {
        wins++; $('#wn').textContent = wins; U.sfx.korok(); State.count('leafWins'); FX.floatText(b, 'Yahaha! You found me!', 'xp');
        const s = S(); if (wins % 2 === 0) { s.seeds++; s.seedsTotal++; FX.banner('+1 Korok Seed!', 'grace'); } State.save();
        setTimeout(round, 1400);
      } else { U.sfx.wrong(); $('#msg').textContent = 'Oh no! It was over there!'; setTimeout(() => { const s = S(); const prize = wins * 8; s.rupees += prize; State.save(); UI().modal(`<h3>Game over</h3><p>You found the Korok <b>${wins}</b> time${wins === 1 ? '' : 's'}.</p><p>Prize: <b>${prize} rupees</b>${wins >= 2 ? ` and ${Math.floor(wins / 2)} Korok seed${wins >= 4 ? 's' : ''}` : ''}</p>`, [{ label: 'Done', cls: 'primary', fn: leafIntro }]); }, 1200); }
    }));
    setTimeout(round, 500);
  }

  /* ---------------- HOUSE ---------------- */
  // the house lives in house.js (room scene + Hall of Fame)
  function house() { return House.show(); }

  /* ---------------- SIDE QUESTS ---------------- */
  function quests() {
    const s = S(); const { screen, hud, on, sequence } = UI();
    const lockedRegions = STORY.regions.filter(r => !s.bosses[r.id]);
    const list = K.QUESTS.filter(q => State.questOpen(q)).map(q => { const v = State.questValue(q.goal[0]); const done = v >= q.goal[1]; const claimed = s.quests[q.id]; return { q, v: Math.min(v, q.goal[1]), done, claimed }; })
      .sort((a, b) => (a.claimed - b.claimed) || (b.done - a.done));
    const rewardTxt = r => [r.rupees && `${fmt(r.rupees)} rupees`, r.tickets && `${r.tickets} tickets`, r.armour && K.ARMOUR.find(x => x.id === r.armour).name, r.saddle && K.SADDLES.find(x => x.id === r.saddle).name, r.pet && 'companion: ' + K.PETS.find(x => x.id === r.pet).name, r.theme && 'Slate colour: ' + K.THEMES.find(x => x.id === r.theme).name, r.decor && K.DECOR.find(x => x.id === r.decor).name, r.item && Object.keys(r.item).map(k => K.ITEMS.find(x => x.id === k).name).join(', '), r.ingredient && Object.keys(r.ingredient).map(k => ING(k).name).join(', ')].filter(Boolean).join(' · ');
    screen(`${hud()}<div class="page"><div class="page-head">${back()}<h2>Side Quests</h2><span class="pill">${Object.keys(s.quests).length}/${K.QUESTS.length} done</span></div>
      ${lockedRegions.map(r => `<div class="quest slate locked-q"><span class="q-ico">🔒</span><div><h3>${r.name}</h3><p class="muted">Free ${r.beast} to meet the locals and unlock their quests and mini-game.</p></div></div>`).join('')}
      <div class="quests">${list.map(({ q, v, done, claimed }) => `<div class="quest slate ${claimed ? 'claimed' : done ? 'ready' : ''}">
        <span class="q-ico">${q.icon}</span><div><h3>${q.title}</h3><p><b>${q.npc}:</b> "${q.text}"</p>
        <div class="bar"><i style="width:${(v / q.goal[1]) * 100}%"></i></div><small class="muted">${fmt(v)}/${fmt(q.goal[1])} · Reward: ${rewardTxt(q.reward)}</small></div>
        <div>${claimed ? '<span class="tag ok">Done ✓</span>' : done ? `<button class="btn primary glow" data-claim="${q.id}">Claim!</button>` : ''}</div></div>`).join('')}</div></div>`, 'map', 'field');
    on('#back', Game.map);
    on('[data-claim]', (e, el) => { const q = K.QUESTS.find(x => x.id === el.dataset.claim); s.quests[q.id] = true; const steps = grant(q.reward); State.save(); U.sfx.fanfare(); UI().confetti(60); sequence(steps, quests); });
  }

  /* ---------------- GREAT FAIRY ---------------- */
  function fairy() {
    const s = S(); const { screen, hud, on } = UI();
    if (!s.fairy.open) {
      screen(`${hud()}<div class="page center"><div class="page-head">${back('◀ Goddess Statue')}<h2>Great Fairy Fountain</h2></div>
        <div class="fountain closed">🌸</div>
        <p class="intro slate">A giant flower bud sleeps in the fountain. A voice whispers: "Offer <b>${fmt(K.FAIRY_OPEN)} rupees</b>, and I shall awaken… and make your armour stronger."</p>
        <button class="btn big ${s.rupees >= K.FAIRY_OPEN ? 'primary glow' : ''}" id="wake" ${s.rupees >= K.FAIRY_OPEN ? '' : 'disabled'}>Offer ${price(K.FAIRY_OPEN)}</button></div>`, 'shrine', 'shrine');
      on('#back', () => Game.statue()); on('#wake', () => { spend(K.FAIRY_OPEN); s.fairy.open = true; State.save(); FX.flash('#ffc0f0', 1); FX.itemGet('<span class="emo big">🧚‍♀️</span>', 'The Great Fairy awakens!', 'Bring her rupees and monster parts to upgrade your armour.', fairy); });
      return;
    }
    const rows = K.ARMOUR.filter(a => s.ownedArmour.includes(a.id) && a.id !== 'tunic').map(a => {
      const lv = s.fairy.levels[a.id] || 0; const cost = K.FAIRY_COSTS[lv];
      if (!cost) return `<div class="shop-row slate"><span class="si">${a.emoji}</span><div><b>${a.name} <span class="stars">★★★★</span></b><p class="muted">Fully upgraded! Perk ×2.</p></div><span class="tag ok">MAX</span></div>`;
      const matsOk = Object.entries(cost.mats).every(([m, n]) => (s.materials[m] || 0) >= n); const ok = matsOk && s.rupees >= cost.rupees;
      return `<div class="shop-row slate"><span class="si">${a.emoji}</span><div><b>${a.name} <span class="stars">${'★'.repeat(lv)}${'☆'.repeat(4 - lv)}</span></b><p class="muted">Next level: perk ×${(1 + 0.25 * (lv + 1)).toFixed(2)}. Needs ${Object.entries(cost.mats).map(([m, n]) => `${ING(m).emoji} ${ING(m).name} ${s.materials[m] || 0}/${n}`).join(', ')}</p></div><button class="btn small ${ok ? 'primary' : ''}" data-up="${a.id}" ${ok ? '' : 'disabled'}>${price(cost.rupees)}</button></div>`;
    }).join('') || '<p class="muted center">Buy armour from Beedle (or earn it in side quests), then bring it here.</p>';
    screen(`${hud()}<div class="page"><div class="page-head">${back('◀ Goddess Statue')}<h2>Great Fairy Fountain</h2></div>
      <div class="fountain">🧚‍♀️</div><p class="intro slate">"Ahh, a hero! Bring me rupees and monster parts, and I will make your armour's power grow!"</p><div class="shop">${rows}</div></div>`, 'shrine', 'shrine');
    on('#back', () => Game.statue());
    on('[data-up]', (e, el) => {
      const a = K.ARMOUR.find(x => x.id === el.dataset.up); const lv = s.fairy.levels[a.id] || 0; const cost = K.FAIRY_COSTS[lv];
      spend(cost.rupees); for (const [m, n] of Object.entries(cost.mats)) { s.materials[m] -= n; if (!s.materials[m]) delete s.materials[m]; }
      s.fairy.levels[a.id] = lv + 1; State.save(); FX.flash('#ffc0f0', 0.8);
      FX.itemGet(`<span class="emo big">${a.emoji}</span>`, `${a.name} ${'★'.repeat(lv + 1)}`, 'Its power has grown!', fairy);
    });
  }

  window.World = { ticketGate, checkMastery, masteryPanel, masteryProgress, applyTheme, shop, bag, kitchen, stable, wildField, archeryIntro, kassIntro, leafIntro, house, quests, fairy, trialDrops, grant, mealInfo };
  if (S()) applyTheme();
})();
</script>

    },

      <rect x="261" y="122" width="56" height="20" rx="2" fill="#7fc8ec" fill-opacity=".85" stroke="${I}" stroke-width="1.2"/>
      <g class="fish-swim"><path d="M270,132 q4,-4 8,0 q-4,4 -8,0z M278,132 l3,-2 v4z" fill="#ff8a2a"/><path d="M296,129 q3,-3 6,0 q-3,3 -6,0z" fill="#3fb0ff"/></g>

    pot: () => place(icon('pot'), 312, 186, 46, 46),
    plant: () => place(icon('plant'), 362, 158, 34, 36),
    korokstatue: () => place(icon('korokstatue'), 132, 142, 22, 27),
    goldstatue: () => `<ellipse cx="300" cy="200" rx="18" ry="5" fill="#ffd23d" opacity=".25" class="hearth-glow"/>${place(icon('goldstatue'), 278, 150, 44, 54)}`,
    goronruby: () => `<path d="M6,124 l26,-6 v4 l-26,6z" fill="#7a5230" stroke="${I}" stroke-width=".8"/>${place(icon('goronruby'), 9, 96, 22, 28)}`,
    zorafountain: () => place(icon('zorafountain'), 244, 206, 38, 38),
    'm-rudania': () => place(icon('m-rudania'), 54, 58, 18, 20),
    'm-ruta': () => place(icon('m-ruta'), 73, 58, 18, 20),
    'm-medoh': () => place(icon('m-medoh'), 92, 58, 18, 20),
    'm-naboris': () => place(icon('m-naboris'), 111, 58, 18, 20),
    'm-triforce': () => `<ellipse cx="200" cy="140" rx="22" ry="22" fill="#fff6a0" opacity=".25" class="tri-glow"/>${place(icon('m-triforce'), 188, 124, 24, 24, 'class="tri-float"')}`,

  // the order things are drawn in (back to front)
  const LAYERS = ['lamp', 'ritochime', 'painting', 'fire', 'm-rudania', 'm-ruta', 'm-medoh', 'm-naboris', 'rack', 'trophies', 'books', 'sealfigure', 'cycletrophy', 'aquarium',

  function windowView() {
    const s = S(); const h = new Date().getHours(); const night = h >= 19 || h < 7;
    const horse = s.activeHorse !== null && s.horses[s.activeHorse];
    return `<clipPath id="win-clip"><rect x="178" y="40" width="70" height="66" rx="2"/></clipPath>
      <g clip-path="url(#win-clip)">
        <rect x="178" y="40" width="70" height="66" fill="url(#${night ? 'sky-n' : 'sky-d'})"/>
        ${night ? [[186, 48], [200, 56], [214, 46], [236, 52], [226, 62], [192, 64]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r=".9" fill="#fff"/>`).join('') + '<circle cx="236" cy="50" r="5" fill="#f4f2d8"/>' : '<circle cx="236" cy="52" r="6" fill="#fff6c8" opacity=".9"/>'}
        <path d="M178,86 Q196,74 214,82 Q232,72 250,82 V106 H178Z" fill="${night ? '#2a4a3a' : '#7fbf6a'}"/>
        <path d="M178,96 Q210,88 250,96 V106 H178Z" fill="${night ? '#1f3a2c' : '#5c9f48'}"/>
        <path d="M228,84 l4,-10 l4,10z" fill="${night ? '#1f3a2c' : '#3d7f42'}"/>

      <rect x="178" y="40" width="70" height="66" rx="2" fill="none" stroke="#5a3a22" stroke-width="4"/><path d="M213,40 V106 M178,73 H248" stroke="#5a3a22" stroke-width="2.4"/>
      <path d="M174,108 h78 v4 h-78z" fill="#7a5230" stroke="${I}" stroke-width=".8"/>
      <path d="M172,36 Q176,70 174,108 L180,108 Q182,70 178,38Z M254,36 Q250,70 252,108 L246,108 Q244,70 248,38Z" fill="#c63b4f" stroke="${I}" stroke-width=".8"/>
      <path d="M170,36 h86" stroke="#5a3a22" stroke-width="2.4" stroke-linecap="round"/>`;
  }

  function roomSvg() {
    const s = S(); const has = id => s.house.decor.includes(id);
    const hero = place(ART.hero({ armour: s.armour, shield: s.shield, weapon: s.weapon }), 188, 186, 40, 52);
    const pet = s.pet !== 'none' ? place(ART.pet(s.pet), 228, 214, 22, 24) : '';
    const rested = s.rested === today();
    return `<svg class="art room-svg" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">

        <filter id="ghost-f"><feColorMatrix type="matrix" values="0 0 0 0 .3  0 0 0 0 .22  0 0 0 0 .12  0 0 0 .32 0"/></filter>
      </defs>
      <rect width="400" height="250" fill="#3a2a1a"/>
      <path d="M40,20 H360 V165 H40Z" fill="url(#wall-g)"/>
      <path d="M0,0 L40,20 V165 L0,250Z" fill="#cdb488"/><path d="M400,0 L360,20 V165 L400,250Z" fill="#cdb488"/>

      ${[80, 140, 200, 260, 320].map(x => `<path d="M${x},0 L${40 + (x - 40) * 0.8 + 8},20" stroke="#3a2618" stroke-width="5"/>`).join('')}
      <path d="M40,20 V165 M360,20 V165 M40,92 H52 M130,92 H170 M256,92 H258 M322,92 H326 M40,20 H360" stroke="#6b4423" stroke-width="3" fill="none"/>
      <path d="M40,165 H360 L400,250 H0Z" fill="url(#floor-g)"/>
      ${[0, 1, 2, 3, 4, 5, 6, 7, 8].map(i => `<path d="M${40 + i * 40},165 L${i * 50},250" stroke="#5a3a1a" stroke-width="1" opacity=".55"/>`).join('')}
      ${[180, 200, 224].map(y => `<path d="M${40 - (y - 165) * 0.47},${y} H${360 + (y - 165) * 0.47}" stroke="#5a3a1a" stroke-width=".7" opacity=".4"/>`).join('')}
      <path d="M40,165 H360" stroke="#4a3022" stroke-width="2.4"/>

  }

  /* ---------------- Hall of Fame ---------------- */
  function stats() {
    const s = S(); const all = State.SUBJECTS.flatMap(x => CONTENT[x]); const r = State.rank();
    const maxBond = s.horses.reduce((m, h) => Math.max(m, h.bond), 0);
    return [
      ['⭐', 'Shrine stars', `${State.totalStars()}/${all.length * 3}`],
      ['🏅', 'Shrines at ★★★', `${all.filter(t => (s.stars[t.id] || 0) >= 3).length}/${all.length}`],
      ['🐉', 'Divine Beasts freed', `${State.bossesBeaten()}/4`],
      ['🏆', 'Regions mastered', `${STORY.regions.filter(x => s.mastered[x.id]).length}/4`],
      ['🌰', 'Korok seeds found', fmt(s.seedsTotal)],
      ['📖', 'Recipes discovered', `${s.recipes.length}/${K.RECIPES.length}`],
      ['🐴', 'Horses', `${s.horses.length}${maxBond ? ` · best bond ${'💗'.repeat(maxBond)}` : ''}`],
      ['📜', 'Side quests done', `${Object.keys(s.quests).length}/${K.QUESTS.length}`],
      ['✅', 'Questions right', fmt(s.stats.correct)],
      ['🔥', 'Best combo', s.stats.bestStreak],
    ];
  }
  const MEDALS = [
    ['First Trial', 'Clear your first shrine trial', s => s.stats.trials >= 1, '#cd7f32', () => ART.icons.shrine('done')],
    ['Shrine Seeker', 'Earn 50 shrine stars', () => State.totalStars() >= 50, '#c0c8d0', () => `<svg viewBox="0 0 24 24"><path d="M12,2 l3,7 l7,.6 l-5.4,4.6 l1.8,7 l-6.4,-4 l-6.4,4 l1.8,-7 l-5.4,-4.6 l7,-.6z" fill="#ffd23d" stroke="${I}" stroke-width="1.2"/></svg>`],
    ['Blight Breaker', 'Free a Divine Beast', () => State.bossesBeaten() >= 1, '#c0c8d0', () => ART.beast('maths', true)],
    ['Four Champions', 'Free all four Divine Beasts', () => State.bossesBeaten() >= 4, '#ffd23d', () => ART.beast('verbal', true)],
    ['Calamity Sealed', 'Defeat Calamity Ganon', s => !!s.calamity, '#ffd23d', () => ART.calamity()],
    ['Blade of Evil\'s Bane', 'Draw the Master Sword', s => s.ownedWeapons.includes('master'), '#ffd23d', () => K.WEAPONS.find(w => w.id === 'master').emoji],
    ['Champion\'s Pride', 'Master a region (★★★ in every shrine)', s => STORY.regions.some(x => s.mastered[x.id]), '#ffd23d', () => icon('trophies')],
    ['Hero of Hyrule', 'Master every region', s => !!s.mastered.all, '#7ff3ff', () => icon('m-triforce')],
    ['Korok Friend', 'Find 40 Korok seeds', s => s.seedsTotal >= 40, '#c0c8d0', () => ART.icons.seed()],
    ['Master Chef', 'Discover every recipe', s => s.recipes.length >= K.RECIPES.length, '#ffd23d', () => K.RECIPES[0].emoji],
    ['Horse Whisperer', 'Raise a horse to full bond', s => s.horses.some(h => h.bond >= 5), '#c0c8d0', () => ART.icons.stable()],
    ['Exam Ace', 'Score 85% on a practice paper', () => State.questValue('mockBest') >= 85, '#ffd23d', () => ART.icons.lab()],
    ['Helping Hand', 'Complete 10 side quests', s => Object.keys(s.quests).length >= 10, '#c0c8d0', () => K.ITEMS.find(i => i.id === 'ticket').emoji],
    ['Combo Legend', 'Get a 15-answer combo', s => s.stats.bestStreak >= 15, '#ffd23d', () => K.WEAPONS.find(w => w.id === 'flame').emoji],
  ];
  const medalSvg = (c, got, sym) => `<svg viewBox="0 0 40 52" class="medal-svg"><path d="M12,0 h7 l5,18 h-7z" fill="${got ? '#c63b4f' : '#555'}"/><path d="M28,0 h-7 l-5,18 h7z" fill="${got ? '#2f55b5' : '#444'}"/>
    <circle cx="20" cy="32" r="16" fill="${got ? c : '#3a3a40'}" stroke="${I}" stroke-width="1.6"/><circle cx="20" cy="32" r="12" fill="none" stroke="${got ? '#fff' : '#555'}" stroke-width="1" opacity=".6"/>
    ${got ? place(sym(), 9, 21, 22, 22) : '<text x="20" y="37" text-anchor="middle" font-size="13" font-weight="800" fill="#666">?</text>'}</svg>`;

  /* ---------------- the screen ---------------- */
  function show() {
    const s = S(); const { screen, hud, on, toast, modal } = UI();
    if (!s.house.owned) {
      screen(`${hud()}<div class="page center"><div class="page-head"><button class="btn ghost" id="back">◀ Map</button><h2>Hateno Village</h2></div>
        <div class="house-outside">${ART.icons.house()}</div>
        <p class="intro slate">Hudson: "This old house is for sale! It needs some love, but it could be a real home: somewhere to show off every trophy you win on your adventure. Only <b>${fmt(K.HOUSE_PRICE)} rupees</b>!"</p>
        <button class="btn big ${s.rupees >= K.HOUSE_PRICE ? 'primary glow' : ''}" id="buy" ${s.rupees >= K.HOUSE_PRICE ? '' : 'disabled'}>Buy the house (${ART.icons.rupee('green')} ${fmt(K.HOUSE_PRICE)})</button>
        <p class="muted">You have ${fmt(s.rupees)} rupees. Keep clearing shrines to save up!</p></div>`, 'plateau', 'home');
      on('#back', Game.map);
      on('#buy', () => { s.rupees -= K.HOUSE_PRICE; State.count('spent', K.HOUSE_PRICE); s.house.owned = true; State.save(); FX.itemGet(`<span class="emo big">${ART.icons.house()}</span>`, 'You bought a house!', 'Decorate it with furniture from Bolson Construction, and fill it with your trophies.', show); });
      return;
    }
    const has = id => s.house.decor.includes(id);
    const owned = K.DECOR.filter(d => has(d.id)).length;
    const rested = s.rested === today();
    const medals = MEDALS.map(([name, how, test, c, sym]) => { const got = !!test(s); return { name, how, got, c, sym }; });
    const shopList = K.DECOR.filter(d => d.price !== null && !has(d.id));
    screen(`${hud()}<div class="page house-page">
      <div class="page-head"><button class="btn ghost" id="back">◀ Map</button><h2>${U.esc(s.hero)}'s House</h2><span class="pill">🏠 ${owned}/${K.DECOR.length}</span></div>
      <div class="room-frame">${roomSvg()}</div>
      <p class="muted center room-hint">Tap anything in the room. Faint shapes show what's still to come!</p>
      <div class="row center">${has('bed') ? `<button class="btn ${rested ? '' : 'primary'}" id="sleep" ${rested ? 'disabled' : ''}>🛏️ ${rested ? 'Rested today' : 'Sleep (+10% XP next trial)'}</button>` : ''}${has('pot') ? '<button class="btn" id="cook">🍲 Cook</button>' : ''}</div>
      <h3 class="hof-title">🏛️ Hall of Fame</h3>
      <div class="hof-stats">${stats().map(([ic, label, v]) => `<div class="hof-stat slate"><span>${ic}</span><b>${v}</b><small>${label}</small></div>`).join('')}</div>
      <div class="hof-rank slate"><span class="rank-big">${State.rank().level}</span><div><b>Hero Rank: ${State.rank().title}</b><small>${medals.filter(m => m.got).length}/${medals.length} medals earned</small></div></div>
      <div class="medals">${medals.map(m => `<div class="medal ${m.got ? 'got' : ''}" title="${m.how}">${medalSvg(m.c, m.got, m.sym)}<b>${m.name}</b><small>${m.got ? '✓ Earned' : m.how}</small></div>`).join('')}</div>
      ${shopList.length ? `<h3>🔨 Bolson Construction</h3><p class="muted">"Hoo-HAH! Pick something and my crew will put it in just the right spot!"</p>
        <div class="bolson">${shopList.map(d => `<button class="bolson-item slate" data-decor="${d.id}" ${s.rupees >= d.price ? '' : 'disabled'}><span class="bi-ic">${d.emoji}</span><b>${d.name}</b><small>${ART.icons.rupee('green')} ${fmt(d.price)}</small></button>`).join('')}</div>` : '<p class="muted center">Every piece of furniture Bolson sells is in your house! 🎉</p>'}
    </div>`, 'plateau', 'home');
    on('#back', Game.map);
    on('#sleep', () => { s.rested = today(); s.restedBonus = true; State.save(); FX.flash('#0a0a30', 0.9); FX.banner('Zzz… Well rested!', 'grace'); setTimeout(show, 1200); });
    on('#cook', () => World.kitchen('house'));
    const buy = id => { const d = K.DECOR.find(x => x.id === id); if (!d || d.price === null || s.rupees < d.price || has(id)) return; s.rupees -= d.price; State.count('spent', d.price); s.house.decor.push(id); State.save(); U.sfx.coin(); toast(`${d.emoji} ${d.name} placed!`, 'good'); show(); setTimeout(() => { const g = $(`[data-spot="${id}"]`); if (g) { g.classList.add('just-placed'); const [x, y] = FX.center(g); FX.burst(x, y, { n: 30, colors: ['#ffd23d', '#fff', '#3fe0ff'], kind: 'star', speed: 220 }); } }, 120); };
    on('[data-decor]', (e, el) => buy(el.dataset.decor));
    $$('.room-svg .spot').forEach(g => g.addEventListener('click', () => {
      const id = g.dataset.spot; const d = K.DECOR.find(x => x.id === id); if (!d) return; U.sfx.click();
      const earned = d.mastery ? `Your reward for mastering ${d.mastery === 'all' ? 'every region in Hyrule' : STORY.regions.find(r => r.id === d.mastery).name}. Nobody else has one!` : d.price === null ? 'Your reward for completing a side quest.' : 'Part of your collection.';
      const how = has(id) ? (d.desc || earned) : d.price !== null ? `Bolson can build this for <b>${fmt(d.price)} rupees</b>.` : d.mastery ? `A trophy for mastering ${d.mastery === 'all' ? 'every region' : STORY.regions.find(r => r.id === d.mastery).name} (★★★ in every shrine).` : 'A reward from a side quest. Check the Quests board!';
      modal(`<div class="decor-pop">${d.emoji}</div><h3>${d.name}</h3><p>${how}</p>`, has(id) || d.price === null ? [{ label: 'Nice!', cls: 'primary' }] : [{ label: 'Not now' }, { label: `Build it (${fmt(d.price)})`, cls: 'primary', fn: () => buy(id) }]);
    }));
  }

  window.House = { show };
})();
</script>
<script>
// Regional activities that open once a Divine Beast is freed, plus the Master Cycle Zero run (the reward for 3-starring all of Hyrule).
// Each game draws to a high-DPI canvas; characters are the SVG artwork rendered to images so they stay sharp.
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const S = () => State.s;
  const UI = () => Game.ui;
  const K = CATALOG;
  const today = () => new Date().toISOString().slice(0, 10);
  const back = label => `<button class="btn ghost" id="back">${label}</button>`;

  /* ---------------- canvas helpers ---------------- */
  const imgs = {};
  function sprite(key, svgStr, w, h) {
    if (imgs[key]) return imgs[key];
    const im = new Image();
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgStr.replace('<svg ', `<svg width="${w * 3}" height="${h * 3}" `));
    return (imgs[key] = im);
  }
  const ready = im => im.complete && im.naturalWidth > 0;
  function stage(el, aspect) {
    const cv = document.createElement('canvas'); el.appendChild(cv);
    const dpr = Math.min(3, window.devicePixelRatio || 1);
    const W = Math.min(el.clientWidth || 360, 560), H = Math.round(W * aspect);
    cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px';
    const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
    return { cv, ctx, W, H };
  }
  function loop(cv, fn) {
    let last = performance.now();
    const tick = now => { if (!cv.isConnected) return; const dt = Math.min(0.05, (now - last) / 1000); last = now; if (fn(dt) !== false) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function rupee(ctx, x, y, s, c1 = '#5ce06a', c2 = '#1f8f3a') {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
    ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(7, -6); ctx.lineTo(7, 6); ctx.lineTo(0, 12); ctx.lineTo(-7, 6); ctx.lineTo(-7, -6); ctx.closePath();
    ctx.fillStyle = c1; ctx.fill(); ctx.lineWidth = 1.4; ctx.strokeStyle = '#123'; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(3, -4); ctx.lineTo(3, 4); ctx.lineTo(0, 7); ctx.lineTo(-3, 4); ctx.lineTo(-3, -4); ctx.closePath(); ctx.fillStyle = c2; ctx.globalAlpha = 0.55; ctx.fill(); ctx.globalAlpha = 1;
    ctx.restore();
  }
  function hud(ctx, W, items) {
    ctx.save(); ctx.font = '700 15px Lexend, system-ui, sans-serif'; ctx.textBaseline = 'middle';
    let x = 10;
    for (const t of items) { const w = ctx.measureText(t).width + 20; rr(ctx, x, 8, w, 28, 14); ctx.fillStyle = 'rgba(9,20,31,.78)'; ctx.fill(); ctx.strokeStyle = 'rgba(150,230,255,.4)'; ctx.lineWidth = 1; ctx.stroke(); ctx.fillStyle = '#eef7fd'; ctx.fillText(t, x + 10, 22); x += w + 6; }
    ctx.restore();
  }
  function bindKeys(map) { UI().onKey(e => { const f = map[e.key]; if (f) { e.preventDefault(); f(); } }); }
  function finish(title, html, onDone) { setTimeout(() => UI().modal(`<h3>${title}</h3>${html}`, [{ label: 'Done', cls: 'primary', fn: onDone }]), 500); }

  /* ---------------- shared intro screen ---------------- */
  function intro(cfg) {
    const s = S(); const { screen, hud: topHud, on } = UI();
    screen(`${topHud()}<div class="page center"><div class="page-head">${back(cfg.backLabel)}<h2>${cfg.title}</h2>${cfg.free ? '' : `<span class="pill">🎫 ${s.tickets}</span>`}</div>
      <div class="npc-stand big">${cfg.art}</div>
      <p class="intro slate"><b>${cfg.npc}:</b> "${cfg.text}"</p>
      <p class="muted">${cfg.best}</p>
      <button class="btn big primary glow" id="go">${cfg.free ? '▶ Ride!' : '▶ Play (🎫1)'}</button></div>`, cfg.theme, cfg.music);
    on('#back', cfg.onBack);
    on('#go', () => (cfg.free ? cfg.play() : World.ticketGate(cfg.title, cfg.play)));
  }
  const toRegion = id => () => Game.regionScreen(id);
  function gameScreen(title, extra, theme, music) {
    UI().screen(`<div class="page center mg-page"><h2>${title}</h2><div class="mg-stage" id="mg"></div>${extra}</div>`, theme, music);
    return $('#mg');
  }

  /* ======================= DEATH MOUNTAIN: Yunobo's Rock Roll ======================= */
  // Roll down the mountain in three lanes: dodge lava boulders, scoop up gems.

  /* ======================= ZORA'S DOMAIN: catching fish by hand ======================= */
  // Like the game, there's no fishing rod: fish swim as shadows and rise to the surface. Grab them while they're up!
  // Tap a fish that's still deep and it darts away. Ironshell crabs sometimes scuttle along the shore.
  const FISH = { fish: ['Hyrule Bass', '#8fb06a', '#4f7a4a'], salmon: ['Hearty Salmon', '#ff8a7a', '#c2385a'], crab: ['Ironshell Crab', '#6a8aaa', '#34465e'] };

    ctx.beginPath(); ctx.moveTo(16, 0); ctx.quadraticCurveTo(4, -10, -10, -2); ctx.lineTo(-20, -9); ctx.lineTo(-17, 0); ctx.lineTo(-20, 9); ctx.lineTo(-10, 2); ctx.quadraticCurveTo(4, 10, 16, 0); ctx.closePath(); ctx.fillStyle = g; ctx.fill(); ctx.lineWidth = 1.6; ctx.strokeStyle = '#1d1a2b'; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(-6, 0); ctx.quadraticCurveTo(4, -3, 12, 0); ctx.stroke();

    ctx.beginPath(); ctx.ellipse(0, 0, 12, 7, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    for (const s of [-1, 1]) { ctx.beginPath(); ctx.arc(s * 12, -6, 4, 0, Math.PI * 2); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-3, -5, 1.6, 0, Math.PI * 2); ctx.arc(3, -5, 1.6, 0, Math.PI * 2); ctx.fill();
  }
  function fishing() {
    const el = gameScreen('Zora\'s Reservoir', '<p id="fmsg" class="muted">Tap a fish when it rises to the surface and splashes!</p>', 'english', 'english');

    const sid = sprite('sidon', ART.sidon(), 120, 150);
    const WATER = H * 0.34, SHORE = H * 0.86;
    let time = 40, caught = 0, over = false, t = 0, spawnCrab = 6;
    const fish = [], fx = [], catches = [];
    const msg = m => { const e = $('#fmsg'); if (e) e.innerHTML = m; };
    const newFish = () => ({ x: W * (0.15 + Math.random() * 0.7), y: WATER + 30 + Math.random() * (SHORE - WATER - 60), a: Math.random() * Math.PI * 2, sp: 30 + Math.random() * 25, up: 0, wait: 1 + Math.random() * 3.5, kind: Math.random() < 0.3 ? 'salmon' : 'fish', flee: 0 });
    for (let i = 0; i < 5; i++) fish.push(newFish());
    const splash = (x, y, n = 14, c = '#e8f6ff') => { for (let i = 0; i < n; i++) fx.push({ x, y, vx: (Math.random() - 0.5) * 160, vy: -60 - Math.random() * 140, life: 0.7, c }); fx.push({ ring: true, x, y, r: 4, life: 0.6 }); };
    const grab = (kind, x, y) => {
      caught++; State.count('fishCaught'); const s = S(); s.ingredients[kind] = (s.ingredients[kind] || 0) + 1; State.save(); catches.push(kind);
      U.sfx.correct(); splash(x, y, 22, '#ffffff'); fx.push({ leap: true, x, y, kind, life: 0.9 }); msg(`Got a <b>${FISH[kind][0]}</b>! It's in your Bag.`);
    };
    cv.addEventListener('pointerdown', e => {
      if (over) return; const r = cv.getBoundingClientRect(); const x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
      let best = null, bd = 34;
      for (const f of fish) { const d = Math.hypot(f.x - x, f.y - y); if (d < bd) { bd = d; best = f; } }
      if (best) {
        if (best.kind === 'crab' || best.up > 0) { grab(best.kind, best.x, best.y); fish.splice(fish.indexOf(best), 1); if (best.kind !== 'crab') fish.push(newFish()); }
        else { best.flee = 1; best.a = Math.atan2(best.y - y, best.x - x); U.sfx.wrong(); msg('Too deep! Wait for it to surface.'); }
      } else splash(x, y, 6);
    });

      t += dt;

        time -= dt; spawnCrab -= dt;
        if (spawnCrab <= 0) { spawnCrab = 7 + Math.random() * 6; fish.push({ kind: 'crab', x: -20, y: SHORE + 16, a: 0, sp: 60, up: 1, wait: 99, flee: 0 }); }
        for (const f of fish) {
          if (f.kind === 'crab') { f.x += f.sp * dt; continue; }
          const sp = f.sp * (f.flee > 0 ? 4 : 1); f.flee = Math.max(0, f.flee - dt);
          f.a += (Math.random() - 0.5) * dt * 2; f.x += Math.cos(f.a) * sp * dt; f.y += Math.sin(f.a) * sp * dt * 0.5;
          if (f.x < W * 0.12 || f.x > W * 0.92) { f.a = Math.PI - f.a; f.x = Math.max(W * 0.12, Math.min(W * 0.92, f.x)); }
          if (f.y < WATER + 24 || f.y > SHORE - 24) { f.a = -f.a; f.y = Math.max(WATER + 24, Math.min(SHORE - 24, f.y)); }
          if (f.up > 0) { f.up -= dt; if (f.up <= 0) f.wait = 1.5 + Math.random() * 3; }

        }

        if (time <= 0) {
          over = true; const s = S(); const prize = caught * 10; s.rupees += prize; State.save();

          finish('Time\'s up!', `<p>You caught <b>${caught}</b>: ${icons || 'nothing this time'}.</p><p>They're in your Bag for cooking, and Sidon gives you <b>${prize} rupees</b>!</p>`, fishIntro);
        }

      // East Reservoir: Zora's Domain glowing in the distance, the lake, a stone shore
      const sky = ctx.createLinearGradient(0, 0, 0, WATER); sky.addColorStop(0, '#1d3f78'); sky.addColorStop(1, '#5a8ac8'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, WATER);
      ctx.fillStyle = '#3a5a8a'; ctx.beginPath(); ctx.moveTo(0, WATER); ctx.lineTo(0, WATER * 0.55); ctx.quadraticCurveTo(W * 0.2, WATER * 0.4, W * 0.35, WATER * 0.62); ctx.lineTo(W * 0.65, WATER * 0.62); ctx.quadraticCurveTo(W * 0.8, WATER * 0.38, W, WATER * 0.5); ctx.lineTo(W, WATER); ctx.fill();
      ctx.save(); ctx.shadowColor = '#7ff3ff'; ctx.shadowBlur = 12;
      ctx.fillStyle = '#d6eef6'; ctx.beginPath(); ctx.ellipse(W * 0.5, WATER * 0.58, W * 0.13, WATER * 0.18, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(W * 0.44, WATER * 0.2, W * 0.12, WATER * 0.4); ctx.beginPath(); ctx.moveTo(W * 0.42, WATER * 0.22); ctx.quadraticCurveTo(W * 0.5, -WATER * 0.05, W * 0.58, WATER * 0.22); ctx.fill();
      ctx.restore(); ctx.fillStyle = '#7ff3ff'; for (let i = 0; i < 4; i++) { ctx.globalAlpha = 0.6 + Math.sin(t * 2 + i) * 0.3; ctx.fillRect(W * (0.455 + i * 0.03), WATER * 0.32, 3, 6); } ctx.globalAlpha = 1;
      const wg = ctx.createLinearGradient(0, WATER, 0, SHORE); wg.addColorStop(0, '#2c8fc8'); wg.addColorStop(1, '#14507e'); ctx.fillStyle = wg; ctx.fillRect(0, WATER, W, SHORE - WATER);
      ctx.strokeStyle = 'rgba(200,240,255,.25)'; ctx.lineWidth = 1.4; for (let i = 0; i < 10; i++) { const y = WATER + 10 + ((i * 29 + t * 10) % (SHORE - WATER - 10)); const x = (i * 83 + t * 14) % W; ctx.beginPath(); ctx.moveTo(x - 16, y); ctx.quadraticCurveTo(x, y - 3, x + 16, y); ctx.stroke(); }
      for (const f of fish) {

        const dirx = Math.cos(f.a) >= 0 ? 1 : -1;
        ctx.save(); ctx.translate(f.x, f.y); ctx.scale(dirx, 1);
        if (f.up > 0) {
          ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(0, 4, 26, 7, 0, 0, Math.PI * 2); ctx.fill();
          fishShape(ctx, f.kind);
          if (f.kind === 'salmon') { ctx.fillStyle = '#ffe0e8'; ctx.globalAlpha = 0.5 + Math.sin(t * 8) * 0.3; ctx.beginPath(); ctx.arc(0, 0, 3, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; }
        } else {

        }
        ctx.restore();

      // shore with the stone Zora dock, Sidon cheering you on
      ctx.fillStyle = '#c9dce4'; ctx.fillRect(0, SHORE, W, H - SHORE); ctx.fillStyle = '#9fb8c4'; for (let x = 0; x < W; x += 26) { ctx.beginPath(); ctx.ellipse(x + 10, SHORE + 3, 13, 4, 0, 0, Math.PI * 2); ctx.fill(); }
      ctx.strokeStyle = '#7fa0b0'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, SHORE); ctx.lineTo(W, SHORE); ctx.stroke();

        else if (p.leap) { const k = 1 - p.life / 0.9; const y = p.y - Math.sin(k * Math.PI) * 60; ctx.save(); ctx.globalAlpha = Math.min(1, p.life * 2); ctx.translate(p.x, y); ctx.scale(1.3, 1.3); ctx.rotate(-0.6 + k * 1.2); if (p.kind === 'crab') crabShape(ctx, t); else fishShape(ctx, p.kind); ctx.restore(); }

  /* ======================= RITO VILLAGE: Snowball Bowling ======================= */
  // Seen from behind the bowler, like the game: push a snowball down the slope (it grows as it rolls) into ten wooden pins.
  // The head pin is nearest you; the row of four is at the back. Pins are knocked over with simple physics.
  function bowling() {
    const el = gameScreen('Snowball Bowling', '<p id="bmsg" class="muted">Watch the arrow, then tap <b>Roll!</b> to push the snowball. Aim for the pin at the front!</p><button class="btn big primary" id="act">☃️ Roll!</button>', 'verbal', 'verbal');
    const { cv, ctx, W, H } = stage(el, 1.15);
    const HZ = H * 0.25, BOT = H + 6, HALF = W * 0.46;
    const P = (x, z) => { const p = 1 / (1 + z * 0.13); return { x: W / 2 + x * HALF * p, y: HZ + (BOT - HZ) * p, s: p }; };
    const PIN_R = 0.12, Z0 = 6.4, DZ = 0.46, DX = 0.27;
    let pins, ball = null, aim = 0, dir = 1, state = 'aim', frame = 1, total = 0, strikes = 0, settle = 0, results = [], t = 0;
    const flakes = Array.from({ length: 40 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 0.6 + Math.random() * 1.4 }));
    const msg = m => { const e = $('#bmsg'); if (e) e.innerHTML = m; };
    const rack = () => { pins = []; for (let k = 0; k < 4; k++) for (let j = 0; j <= k; j++) pins.push({ x: (j - k / 2) * 2 * DX, z: Z0 + k * DZ, vx: 0, vz: 0, down: false, tilt: 0, side: 1 }); };
    rack();
    const act = () => { if (state !== 'aim') return; state = 'roll'; ball = { x: 0, z: 0.5, vx: aim * 0.55 + (Math.random() - 0.5) * 0.04, vz: 6.8, r: 0.2, spin: 0 }; U.sfx.click(); };
    UI().on('#act', act); bindKeys({ ' ': act, Enter: act });
    function drawPin(p) {

      // Hyrule Field at sunset, Hyrule Castle in the distance
      const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#5a7fc9'); sky.addColorStop(0.6, '#ffc58a'); sky.addColorStop(1, '#ffdcae'); ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#7a6a9a'; ctx.beginPath(); ctx.moveTo(0, H * 0.62); for (let x = 0; x <= W + 40; x += 40) ctx.lineTo(x, H * 0.5 + Math.sin((x + scroll * 0.1) / 90) * 18); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
      const cx = W * 0.7 - (scroll * 0.03) % (W * 1.6); ctx.fillStyle = '#5a4a6a';
      ctx.fillRect(cx - 20, H * 0.42, 40, 24); ctx.fillRect(cx - 4, H * 0.32, 8, 14); ctx.beginPath(); ctx.moveTo(cx - 6, H * 0.32); ctx.lineTo(cx, H * 0.26); ctx.lineTo(cx + 6, H * 0.32); ctx.fill();
      for (const dx of [-16, 12]) { ctx.fillRect(cx + dx, H * 0.37, 6, 8); ctx.beginPath(); ctx.moveTo(cx + dx - 1, H * 0.37); ctx.lineTo(cx + dx + 3, H * 0.34); ctx.lineTo(cx + dx + 7, H * 0.37); ctx.fill(); }
      ctx.fillStyle = '#5c8f48'; ctx.beginPath(); ctx.moveTo(0, H * 0.72); for (let x = 0; x <= W + 30; x += 30) ctx.lineTo(x, H * 0.66 + Math.sin((x + scroll * 0.35) / 50) * 10); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
      ctx.fillStyle = '#2f6b3a'; for (let i = 0; i < 7; i++) { const x = ((i * 120) - scroll * 0.5) % (W + 120); const xx = x < -60 ? x + W + 120 : x; ctx.beginPath(); ctx.moveTo(xx, H * 0.62); ctx.lineTo(xx + 12, H * 0.74); ctx.lineTo(xx - 12, H * 0.74); ctx.fill(); }
      ctx.fillStyle = '#8f7a52'; ctx.fillRect(0, ground, W, H - ground); ctx.fillStyle = '#6b5a3a'; for (let x = -(scroll % 40); x < W; x += 40) ctx.fillRect(x, ground + 8, 20, 3);
      ctx.fillStyle = '#7d9e5c'; ctx.fillRect(0, ground - 2, W, 4);
      for (const g of gems) rupee(ctx, g.x, g.y, 1.1, '#5cb8ff', '#1f5fbf');
      for (const o of obs) {
        if (o.kind === 'rock') { const rg = ctx.createRadialGradient(o.x - 6, ground - 20, 2, o.x, ground - 12, 26); rg.addColorStop(0, '#a8a090'); rg.addColorStop(1, '#5a5448'); ctx.beginPath(); ctx.ellipse(o.x, ground - 12, 24, 16, 0, Math.PI, 0); ctx.lineTo(o.x + 24, ground); ctx.lineTo(o.x - 24, ground); ctx.fillStyle = rg; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#1d1a2b'; ctx.stroke(); }
        else if (ready(boko)) ctx.drawImage(boko, o.x - 26, ground - 60, 52, 60);
      }
      if (ready(bike)) { ctx.save(); ctx.globalAlpha = inv > 0 && Math.floor(inv * 10) % 2 ? 0.35 : 1; ctx.translate(bx, y); ctx.rotate(vy < 0 ? -0.12 : vy > 100 ? 0.08 : 0); ctx.drawImage(bike, -64, -72, 128, 74); ctx.restore(); }
      ctx.strokeStyle = 'rgba(63,224,255,.6)'; ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(bx - 70 - i * 14, y - 20 - i * 8); ctx.lineTo(bx - 100 - i * 14 - Math.random() * 20, y - 20 - i * 8); ctx.stroke(); }
      hud(ctx, W, [`${Math.floor(dist).toLocaleString('en-GB')} m`, `${'❤️'.repeat(Math.max(0, hearts))}`, `💎 ${coins}`]);
    });
  }
  function cycleIntro() {
    const s = S(); const runs = (s.cycleDay || {}).day === today() ? s.cycleDay.runs : 0;
    intro({ title: 'Master Cycle Run', npc: 'Zelda', art: `<div class="mc-art">${ART.masterCycle()}</div>`, backLabel: '◀ Map', onBack: Game.map, theme: 'map', music: 'castle', play: cycleRun, free: true,
      text: 'The Master Cycle Zero, the final Divine Beast, is yours! Ride it as far as you can across Hyrule. Jump over boulders and Bokoblins, and grab the rupees!', best: `Record: <b>${(s.counters.cycleBest || 0).toLocaleString('en-GB')} m</b> · Rupee prizes for your first 3 rides each day (${Math.max(0, 3 - runs)} left today). No tickets needed!` });
  }

  /* ---------------- region panel (shown on each region's saga screen) ---------------- */
  const ACT = {
    maths: { game: 'Yunobo\'s Rock Roll', art: () => ART.yunobo(), people: 'Goron', open: rockIntro },
    english: { game: 'Zora\'s Reservoir', art: () => ART.sidon(), people: 'Zora', open: fishIntro },
    verbal: { game: 'Snowball Bowling', art: () => ART.teba(), people: 'Rito', open: bowlIntro },
    nonverbal: { game: 'Sand Seal Rally', art: () => ART.riju(), people: 'Gerudo', open: sealIntro },
  };
  function regionPanel(r) {
    const s = S(); const A = ACT[r.id]; const free = !!s.bosses[r.id];
    const qs = K.QUESTS.filter(q => q.region === r.id); const doneQ = qs.filter(q => s.quests[q.id]).length;
    return `<div class="region-act slate ${free ? '' : 'locked'}">
      <div class="ra-art">${A.art()}</div>
      <div><h3>${free ? `🎉 New in ${r.name}` : `🔒 ${r.beast}`}</h3>
        <p>${free ? `With ${r.beast.replace('Divine Beast ', '')} free, the ${A.people}s have new things for you to do!` : `Free ${r.beast} to unlock <b>${A.game}</b> and ${qs.length} new ${A.people} side quests.`}</p>
        ${free ? `<div class="row"><button class="btn primary" id="ra-play">▶ ${A.game}</button><button class="btn" id="ra-q">📜 ${A.people} quests (${doneQ}/${qs.length})</button></div>` : ''}</div></div>`;
  }
  function bindRegionPanel(r) { UI().on('#ra-play', () => ACT[r.id].open()); UI().on('#ra-q', () => World.quests()); }

  // shared helpers for the canvas mini-games in world.js
  window.MG = { sprite, ready, stage, loop, rr, rupee, hud, bindKeys, finish, gameScreen };
  window.Regions = { regionPanel, bindRegionPanel, cycleIntro, rockIntro, fishIntro, bowlIntro, sealIntro };
})();
</script>
